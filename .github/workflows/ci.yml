name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npm run test:rag

      # No secrets needed: clients fall back to placeholders at build time and
      # only require real keys at runtime.
      - name: Build
        run: npm run build

  image:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Builds the same image the host runs, so a broken Dockerfile fails the
      # PR rather than the deploy.
      - name: Build image
        run: docker build -t bookqa:ci .

      - name: Boot it and check it serves
        run: |
          docker run -d --name bookqa-ci -p 3000:3000 bookqa:ci
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/ || true)
            [ "$code" = "200" ] && echo "container serving (HTTP $code)" && exit 0
            sleep 2
          done
          echo "container did not become healthy"; docker logs bookqa-ci; exit 1

  deploy:
    name: Deploy production
    needs: [verify, image]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
            echo "RENDER_DEPLOY_HOOK not set - skipping deploy."
            exit 0
          fi
          curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
          echo "Deploy triggered."
