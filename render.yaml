services:
  - type: web
    name: bookqa
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /api/books
    # PR previews are created by Render automatically. Production deploys are
    # triggered by CI instead, so a failing test cannot reach production.
    autoDeploy: false
    previewsEnabled: true
    # No disk. Render mounts one root-owned, but the container runs as an
    # unprivileged user, so /data was never writable and every upload failed on
    # it. The originals live in Supabase Storage now; this path is only a cache
    # and /tmp is the one directory the app user can always write.
    envVars:
      - key: PDF_CACHE_DIR
        value: /tmp/bookqa-pdfs
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
